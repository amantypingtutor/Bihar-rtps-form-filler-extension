<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 360px;
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    padding: 12px;
    background: #f7f8fa;
    color: #1a1a2e;
  }
  h3 {
    margin: 0 0 10px;
    font-size: 15px;
  }
  .section {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #e5e5e5;
  }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: #666;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  input[type="text"] {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 13px;
    margin-bottom: 6px;
  }
  button {
    padding: 8px 10px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    margin-top: 4px;
  }
  .btn-primary { background: #16a34a; color: white; }
  .btn-primary:hover { background: #128a3e; }
  .btn-secondary { background: #2563eb; color: white; }
  .btn-secondary:hover { background: #1d4ed8; }
  .btn-outline {
    background: white;
    color: #444;
    border: 1px solid #ccc;
  }
  .btn-danger { background: #dc2626; color: white; }

  .profile-row {
    padding: 7px 6px;
    border-bottom: 1px solid #eee;
    font-size: 13px;
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-name { font-weight: 500; margin-bottom: 6px; }
  .row-btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .row-btns button {
    width: auto;
    flex: 1;
    min-width: 60px;
    padding: 5px 6px;
    font-size: 11px;
    margin-top: 0;
  }
  .btn-email { background: #f59e0b; color: white; }
  .btn-email:hover { background: #d97706; }
  #status {
    text-align: center;
    font-size: 12px;
    min-height: 16px;
    margin-top: 4px;
    color: #16a34a;
  }
  .empty-note {
    font-size: 12px;
    color: #888;
    text-align: center;
    padding: 6px 0;
  }
  #fileInput { display: none; }
</style>
</head>
<body>
  <h3>⚡ RTPS Profile Autofill</h3>

  <div class="section">
    <div class="section-title">Naya Profile Banao</div>
    <input type="text" id="profileNameInput" placeholder="Profile ka naam likho (e.g. Mera Aadhaar Form)">
    <button class="btn-primary" id="captureBtn">Is Page Ka Data Capture Karo</button>
  </div>

  <div class="section">
    <div class="section-title">Saved Profiles</div>
    <div id="profileList"></div>
    <div id="emptyNote" class="empty-note" style="display:none;">Koi profile save nahi hai abhi</div>
  </div>

  <div class="section">
    <div class="section-title">Extra Tools</div>
    <button class="btn-secondary" id="openCompressorBtn">🗜️ Compressor Tool Kholo (Image/PDF)</button>
  </div>

  <div class="section">
    <div class="section-title">Import / Export</div>
    <button class="btn-secondary" id="exportAllBtn">Sabhi Profiles Download Karo</button>
    <button class="btn-outline" id="importBtn">Profile File Upload Karo</button>
    <input type="file" id="fileInput" accept=".json">
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
